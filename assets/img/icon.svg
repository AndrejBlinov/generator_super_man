<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="dnaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Фон (скругленный квадрат, как у иконок приложений) -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Спираль ДНК (стилизованная) -->
  <g filter="url(#glow)">
    <path d="M180 400 C 180 300, 332 256, 332 156 C 332 56, 180 112, 180 112" 
          fill="none" stroke="url(#dnaGrad)" stroke-width="24" stroke-linecap="round"/>
    <path d="M332 400 C 332 300, 180 256, 180 156 C 180 56, 332 112, 332 112" 
          fill="none" stroke="url(#dnaGrad)" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Перекладины ДНК -->
    <line x1="210" y1="340" x2="302" y2="310" stroke="#a78bfa" stroke-width="16" stroke-linecap="round"/>
    <line x1="240" y1="256" x2="272" y2="256" stroke="#a78bfa" stroke-width="16" stroke-linecap="round"/>
    <line x1="210" y1="172" x2="302" y2="202" stroke="#a78bfa" stroke-width="16" stroke-linecap="round"/>
  </g>
  
  <!-- Кристалл эволюции в центре -->
  <polygon points="256,180 306,256 256,360 206,256" fill="url(#crystalGrad)" filter="url(#glow)"/>
  <polygon points="256,180 256,360 206,256" fill="#fbbf24" opacity="0.6"/>
  
  <!-- Блик на кристалле -->
  <polygon points="256,190 280,256 256,256" fill="#ffffff" opacity="0.4"/>
</svg>